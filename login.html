<script>
        // Tab Switching Logic
        function switchTab(tabId) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');

            if (tabId === 'login') {
                // Style Tabs
                loginTab.classList.add('text-primary', 'border-primary');
                loginTab.classList.remove('text-on-surface-variant', 'border-transparent');
                registerTab.classList.add('text-on-surface-variant', 'border-transparent');
                registerTab.classList.remove('text-primary', 'border-primary');

                // Animate Forms
                registerForm.classList.add('opacity-0', 'translate-x-12', 'pointer-events-none');
                registerForm.classList.remove('opacity-100', 'translate-x-0', 'relative');
                registerForm.classList.add('absolute');
                
                setTimeout(() => {
                    loginForm.classList.remove('opacity-0', '-translate-x-12', 'absolute', 'pointer-events-none');
                    loginForm.classList.add('opacity-100', 'translate-x-0', 'relative');
                }, 50); // Small delay to allow absolute positioning to settle

            } else {
                // Style Tabs
                registerTab.classList.add('text-primary', 'border-primary');
                registerTab.classList.remove('text-on-surface-variant', 'border-transparent');
                loginTab.classList.add('text-on-surface-variant', 'border-transparent');
                loginTab.classList.remove('text-primary', 'border-primary');

                // Animate Forms
                loginForm.classList.add('opacity-0', '-translate-x-12', 'pointer-events-none');
                loginForm.classList.remove('opacity-100', 'translate-x-0', 'relative');
                loginForm.classList.add('absolute');

                setTimeout(() => {
                    registerForm.classList.remove('opacity-0', 'translate-x-12', 'absolute', 'pointer-events-none');
                    registerForm.classList.add('opacity-100', 'translate-x-0', 'relative');
                }, 50);
            }
        }

        // Initialize state
        switchTab('login');

        // Toggle Password Visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple Password Strength Meter
        function checkStrength(password) {
            let strength = 0;
            if (password.length > 0) strength += 1; // Needs to be something
            if (password.length > 5) strength += 1; // Length > 5
            if (password.length > 8 && /[A-Z]/.test(password)) strength += 1; // Length > 8 and uppercase
            if (password.length > 8 && /[0-9!@#$%^&*]/.test(password)) strength += 1; // Length > 8 and num/special

            const bars = [
                document.getElementById('strength-bar-1'),
                document.getElementById('strength-bar-2'),
                document.getElementById('strength-bar-3'),
                document.getElementById('strength-bar-4')
            ];
            const text = document.getElementById('strength-text');

            // Reset classes
            bars.forEach(bar => {
                bar.className = 'h-full flex-1 transition-colors duration-300';
            });

            if (strength === 0) {
                text.textContent = "";
            } else if (strength === 1) {
                bars[0].classList.add('bg-error');
                text.textContent = "Weak";
                text.classList.replace('text-outline-variant', 'text-error');
            } else if (strength === 2) {
                bars[0].classList.add('bg-[#fbbf24]'); // using hardcoded hex for standard warning color not in specific palette
                bars[1].classList.add('bg-[#fbbf24]');
                text.textContent = "Fair";
                text.classList.remove('text-error', 'text-primary');
                text.style.color = '#fbbf24';
            } else if (strength === 3) {
                bars[0].classList.add('bg-primary-container');
                bars[1].classList.add('bg-primary-container');
                bars[2].classList.add('bg-primary-container');
                text.textContent = "Good";
                text.style.color = ''; // reset inline
                text.classList.add('text-primary-container');
            } else if (strength === 4) {
                bars.forEach(bar => bar.classList.add('bg-primary'));
                text.textContent = "Strong";
                text.style.color = '';
                text.classList.add('text-primary');
            }
        }
    </script>
